plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group 'savonitar.click2win'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation(project(":gameserver-core"))
    implementation 'org.springframework.boot:spring-boot-starter-webflux:4.1.1'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:3.1.0'

    // Lombok
    implementation 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

    // Google Protobuf
    implementation 'com.google.protobuf:protobuf-java:3.7.0'

    // Test Dependencies
    implementation 'org.springframework.boot:spring-boot-starter-test:4.1.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
}

test {
    useJUnitPlatform()
}